<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Financiero 2025 - Deudas Pendientes</title>
    
    <!-- Script para silenciar advertencias de defaultProps de librerías externas -->
    <script>
        const originalConsoleError = console.error;
        console.error = (...args) => {
            if (typeof args[0] === 'string' && /defaultProps/.test(args[0])) {
                return;
            }
            originalConsoleError(...args);
        };
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Recharts Dependencies -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>

    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-900 text-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
            PieChart, Pie, Cell, ResponsiveContainer, 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, 
            Tooltip, Legend 
        } = window.Recharts;

        // --- ICONOS ---
        const IconWrapper = ({ children, color = "currentColor", size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const AlertTriangle = (props) => <IconWrapper {...props}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></IconWrapper>;
        const CheckCircle = (props) => <IconWrapper {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconWrapper>;
        const TrendingUp = (props) => <IconWrapper {...props}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></IconWrapper>;
        const TrendingDown = (props) => <IconWrapper {...props}><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></IconWrapper>;
        const DollarSign = (props) => <IconWrapper {...props}><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></IconWrapper>;
        const CalendarIcon = (props) => <IconWrapper {...props}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></IconWrapper>;
        const Users = (props) => <IconWrapper {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconWrapper>;
        const Briefcase = (props) => <IconWrapper {...props}><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></IconWrapper>;
        const ArrowRight = (props) => <IconWrapper {...props}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconWrapper>;
        const InfoIcon = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></IconWrapper>;
        const FileSearch = (props) => <IconWrapper {...props}><path d="M4 22h14a2 2 0 0 0 2-2V7.5L14.5 2H6a2 2 0 0 0-2 2v4"/><path d="M14 2v6h6"/><path d="M5 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="m9 17 2 2"/></IconWrapper>;

        // --- DATOS ACTUALIZADOS ---
        
        const dataPeriodo1 = [
            { name: 'G&G', monto: 8209.72, estado: 'Pendiente', tipo: 'Area' },
            { name: 'Producción', monto: 5296.20, estado: 'Pendiente', tipo: 'Area' },
            { name: 'Proyectos', monto: 93982.19, estado: 'Pagado', tipo: 'Area' },
            { name: 'Guille (Krones)', monto: 31617.84, estado: 'Pagado', tipo: 'Persona' },
        ];

        // Periodo 2 sin la validación de Ana
        const dataPeriodo2 = [
            { name: 'Guillermo', monto: 3957.57, estado: 'Pendiente', tipo: 'Persona' },
            { name: 'Cesar', monto: 3230.58, estado: 'Pendiente', tipo: 'Persona' },
            { name: 'Cesar Zorrilla', monto: 4483.93, estado: 'Pendiente', tipo: 'Persona' },
            { name: 'Ana', monto: 3595.34, estado: 'Pagado', tipo: 'Persona' },
            { name: 'Ana Castillo', monto: 2937.66, estado: 'Pagado', tipo: 'Persona' },
        ];

        // Nuevo Dataset separado para Pendiente Setiembre
        const dataPendienteSept = [
             { name: 'Validación (Ana)', monto: 4338.59, estado: 'Pendiente', tipo: 'Persona', nota: 'Por validar por Ana Castillo' }
        ];

        const dataOctubre = [
            { name: 'Costo Operativo', monto: 10576.14, estado: 'Pendiente', tipo: 'Area' }
        ];

        // ACTUALIZADO: Costo Noviembre corregido a S/ 6763.91
        const dataNoviembre = [
            { name: 'Costo (al 25 Nov)', monto: 6763.91, estado: 'Pendiente', tipo: 'Area' }
        ];

        // Función de cálculo
        const calcularTotales = (dataset) => {
            return dataset.reduce((acc, item) => {
                if (item.estado === 'Pagado') {
                    acc.pagado += item.monto;
                } else {
                    acc.pendiente += item.monto;
                }
                acc.total += item.monto;
                return acc;
            }, { pagado: 0, pendiente: 0, total: 0 });
        };

        const tP1 = calcularTotales(dataPeriodo1);
        const tP2 = calcularTotales(dataPeriodo2);
        const tPendSept = calcularTotales(dataPendienteSept); // Totales de la nueva pestaña
        const tOct = calcularTotales(dataOctubre);
        const tNov = calcularTotales(dataNoviembre);

        const granTotal = {
            pagado: tP1.pagado + tP2.pagado + tPendSept.pagado + tOct.pagado + tNov.pagado,
            pendiente: tP1.pendiente + tP2.pendiente + tPendSept.pendiente + tOct.pendiente + tNov.pendiente,
            total: tP1.total + tP2.total + tPendSept.total + tOct.total + tNov.total
        };

        const COLORS = {
            pendiente: '#EF4444', 
            pagado: '#10B981',    
            bg: '#0F172A',
            card: '#1E293B',
            text: '#F8FAFC'
        };

        const formatMoney = (amount) => `S/ ${amount.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

        // --- COMPONENTES UI ---

        const CustomTooltip = ({ active, payload }) => {
            if (active && payload && payload.length) {
                return (
                    <div className="bg-slate-800 border border-slate-700 p-3 rounded shadow-xl text-white z-50">
                        <p className="font-bold">{payload[0].name}</p>
                        <p className="text-sm">
                            {payload[0].name === 'Pendiente' ? 'Falta cobrar: ' : 'Recuperado: '}
                            <span className={payload[0].name === 'Pendiente' ? 'text-red-400' : 'text-emerald-400'}>
                                {formatMoney(payload[0].value)}
                            </span>
                        </p>
                    </div>
                );
            }
            return null;
        };

        const StatCard = ({ title, amount, subtext, icon: Icon, type }) => (
            <div className={`p-6 rounded-xl border-l-4 shadow-lg transition-transform hover:scale-105 ${type === 'danger' ? 'bg-slate-800 border-red-500' : type === 'success' ? 'bg-slate-800 border-emerald-500' : 'bg-slate-800 border-blue-500'}`}>
                <div className="flex justify-between items-start">
                    <div>
                        <p className="text-slate-400 text-sm font-medium uppercase tracking-wider mb-1">{title}</p>
                        <h3 className={`text-2xl font-bold ${type === 'danger' ? 'text-red-400' : type === 'success' ? 'text-emerald-400' : 'text-white'}`}>
                            {formatMoney(amount)}
                        </h3>
                        <p className="text-slate-500 text-xs mt-2">{subtext}</p>
                    </div>
                    <div className={`p-3 rounded-full ${type === 'danger' ? 'bg-red-500/10 text-red-500' : type === 'success' ? 'bg-emerald-500/10 text-emerald-500' : 'bg-blue-500/10 text-blue-500'}`}>
                        <Icon size={24} />
                    </div>
                </div>
            </div>
        );

        const DebtTable = ({ data, title }) => (
            <div className="bg-slate-800 rounded-xl overflow-hidden shadow-lg border border-slate-700 mt-6">
                <div className="px-6 py-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
                    <h3 className="font-bold text-lg text-white flex items-center gap-2">
                        <Briefcase size={20} className="text-blue-400"/> {title}
                    </h3>
                </div>
                <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm text-slate-400">
                        <thead className="bg-slate-900 text-xs uppercase font-medium text-slate-300">
                            <tr>
                                <th className="px-6 py-3">Concepto / Responsable</th>
                                <th className="px-6 py-3">Monto</th>
                                <th className="px-6 py-3 text-center">Estado</th>
                                <th className="px-6 py-3 text-right">Detalle</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-700">
                            {data.map((item, index) => (
                                <tr key={index} className="hover:bg-slate-700/30 transition-colors">
                                    <td className="px-6 py-4 font-medium text-white flex items-center gap-3">
                                        {item.tipo === 'Area' ? <Briefcase size={16} className="text-slate-500"/> : <Users size={16} className="text-slate-500"/>}
                                        {item.name}
                                    </td>
                                    <td className="px-6 py-4 font-mono text-slate-200">{formatMoney(item.monto)}</td>
                                    <td className="px-6 py-4 text-center">
                                        <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold ${item.estado === 'Pagado' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20 animate-pulse'}`}>
                                            {item.estado === 'Pagado' ? <CheckCircle size={12}/> : <AlertTriangle size={12}/>}
                                            {item.estado.toUpperCase()}
                                        </span>
                                    </td>
                                    <td className="px-6 py-4 text-right">
                                        {item.nota ? (
                                            <span className="text-xs text-yellow-500 flex items-center justify-end gap-1">
                                                <InfoIcon size={14}/> {item.nota}
                                            </span>
                                        ) : (
                                            item.estado === 'Pendiente' && <span className="text-xs text-red-500 font-bold">IMPAGO</span>
                                        )}
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('consolidado');

            const chartDataConsolidado = [
                { name: 'Pendiente', value: granTotal.pendiente },
                { name: 'Pagado', value: granTotal.pagado },
            ];

            // Sumamos el pendiente de setiembre al gráfico de setiembre para mantener la integridad temporal
            const chartDataBarras = [
                { name: 'Ago 15', Pendiente: tP1.pendiente, Pagado: tP1.pagado },
                { name: 'Set', Pendiente: tP2.pendiente + tPendSept.pendiente, Pagado: tP2.pagado },
                { name: 'Oct', Pendiente: tOct.pendiente, Pagado: tOct.pagado },
                { name: 'Nov (25)', Pendiente: tNov.pendiente, Pagado: tNov.pagado },
            ];

            return (
                <div className="min-h-screen bg-slate-900 text-slate-50 font-sans selection:bg-blue-500 selection:text-white pb-20">
                    
                    {/* Header */}
                    <header className="bg-slate-950 border-b border-slate-800 sticky top-0 z-50 backdrop-blur-md bg-opacity-80">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-blue-600 p-2 rounded-lg shadow-lg shadow-blue-900/50">
                                    <TrendingUp className="text-white" size={24} />
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold tracking-tight text-white">Reporte Financiero 2025</h1>
                                    <p className="text-xs text-slate-400">Control de Deudas & Costos (Actualizado Noviembre)</p>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <span className="hidden sm:inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20 animate-pulse">
                                    <AlertTriangle size={12} className="mr-2"/> Pendiente Total: {formatMoney(granTotal.pendiente)}
                                </span>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        
                        {/* KPI Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                            <StatCard 
                                title="Deuda/Costos Pendientes" 
                                amount={granTotal.pendiente} 
                                subtext="Incremento por Oct/Nov"
                                icon={AlertTriangle} 
                                type="danger" 
                            />
                            <StatCard 
                                title="Total Recuperado" 
                                amount={granTotal.pagado} 
                                subtext="Ingresos Consolidados"
                                icon={CheckCircle} 
                                type="success" 
                            />
                            <StatCard 
                                title="Monto Total Operación" 
                                amount={granTotal.total} 
                                subtext="Flujo Anual Acumulado"
                                icon={DollarSign} 
                                type="neutral" 
                            />
                        </div>

                        {/* Navigation Tabs */}
                        <div className="flex flex-wrap gap-2 mb-8 border-b border-slate-800 pb-1 overflow-x-auto">
                            {['consolidado', 'periodo1', 'periodo2', 'pendienteSept', 'octubre', 'noviembre'].map((tab) => {
                                const labels = {
                                    consolidado: 'Resumen Global',
                                    periodo1: '1ra Liq (Ago 15)',
                                    periodo2: 'Setiembre',
                                    pendienteSept: 'Pendiente Set (Ana)', // NUEVA PESTAÑA
                                    octubre: 'Octubre',
                                    noviembre: 'Noviembre'
                                };
                                const isSpecial = tab === 'pendienteSept';
                                return (
                                    <button 
                                        key={tab}
                                        onClick={() => setActiveTab(tab)}
                                        className={`px-4 py-2 rounded-t-lg font-medium text-sm transition-all whitespace-nowrap relative flex items-center gap-2
                                            ${activeTab === tab 
                                                ? 'text-blue-400 bg-slate-800 border-b-2 border-blue-500' 
                                                : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'}
                                            ${isSpecial && activeTab !== tab ? 'text-yellow-500/80 hover:text-yellow-400' : ''}
                                        `}
                                    >
                                        {isSpecial && <FileSearch size={14}/>}
                                        {labels[tab]}
                                    </button>
                                );
                            })}
                        </div>

                        {/* Content Views */}
                        <div className="animate-fade-in-up">
                            
                            {/* VISTA CONSOLIDADA */}
                            {activeTab === 'consolidado' && (
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    {/* Chart Circular */}
                                    <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                                        <h3 className="text-lg font-bold text-white mb-6 flex items-center gap-2">
                                            <TrendingUp size={20} className="text-blue-400"/> Estado Actual (Pago vs Deuda)
                                        </h3>
                                        <div className="h-64 w-full">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <PieChart>
                                                    <Pie
                                                        data={chartDataConsolidado}
                                                        cx="50%"
                                                        cy="50%"
                                                        innerRadius={60}
                                                        outerRadius={80}
                                                        paddingAngle={5}
                                                        dataKey="value"
                                                    >
                                                        {chartDataConsolidado.map((entry, index) => (
                                                            <Cell key={`cell-${index}`} fill={entry.name === 'Pendiente' ? COLORS.pendiente : COLORS.pagado} />
                                                        ))}
                                                    </Pie>
                                                    <Tooltip content={<CustomTooltip />} />
                                                    <Legend verticalAlign="bottom" height={36} iconType="circle"/>
                                                </PieChart>
                                            </ResponsiveContainer>
                                        </div>
                                        <div className="mt-4 text-center p-3 bg-slate-900/50 rounded border border-slate-700">
                                            <p className="text-sm text-slate-400">La deuda/costo pendiente representa el <strong className="text-red-400">{((granTotal.pendiente / granTotal.total) * 100).toFixed(1)}%</strong> del flujo total.</p>
                                        </div>
                                    </div>

                                    {/* Chart Barras */}
                                    <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                                        <h3 className="text-lg font-bold text-white mb-6 flex items-center gap-2">
                                            <ArrowRight size={20} className="text-blue-400"/> Evolución Mensual
                                        </h3>
                                        <div className="h-64 w-full">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <BarChart
                                                    data={chartDataBarras}
                                                    margin={{ top: 20, right: 30, left: 20, bottom: 5 }}
                                                >
                                                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                                    <XAxis dataKey="name" stroke="#94a3b8" tick={{fontSize: 12}} />
                                                    <YAxis stroke="#94a3b8" tickFormatter={(value) => `S/ ${(value/1000).toFixed(0)}k`} tick={{fontSize: 12}}/>
                                                    <Tooltip 
                                                        contentStyle={{ backgroundColor: '#1e293b', borderColor: '#334155', color: '#f8fafc' }}
                                                        formatter={(value) => formatMoney(value)}
                                                    />
                                                    <Legend />
                                                    <Bar dataKey="Pendiente" fill={COLORS.pendiente} radius={[4, 4, 0, 0]} barSize={30} />
                                                    <Bar dataKey="Pagado" fill={COLORS.pagado} radius={[4, 4, 0, 0]} barSize={30} />
                                                </BarChart>
                                            </ResponsiveContainer>
                                        </div>
                                        <div className="mt-4 p-3 bg-red-500/10 border border-red-500/20 rounded-lg flex items-start gap-3">
                                            <AlertTriangle className="text-red-500 shrink-0 mt-0.5" size={16}/>
                                            <p className="text-xs text-red-200">
                                                <strong>Alerta:</strong> Tendencia negativa en Q4. Octubre y Noviembre presentan 100% de costos pendientes.
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* VISTAS DETALLADAS */}
                            {activeTab === 'periodo1' && (
                                <div className="animate-fade-in">
                                    <div className="p-4 bg-slate-800 border-l-4 border-emerald-500 mb-4 rounded-r">
                                        <h4 className="font-bold text-emerald-400">Resumen Agosto (Corte 15)</h4>
                                        <p className="text-sm text-slate-300">Periodo con mayor recaudación gracias a Proyectos (Lipton).</p>
                                    </div>
                                    <DebtTable data={dataPeriodo1} title="Detalle - 1ra Liquidación (Hasta 15 Agosto)" />
                                </div>
                            )}

                            {activeTab === 'periodo2' && (
                                <div className="animate-fade-in">
                                    <div className="p-4 bg-slate-800 border-l-4 border-blue-500 mb-4 rounded-r">
                                        <h4 className="font-bold text-blue-400">Resumen Setiembre</h4>
                                        <p className="text-sm text-slate-300">Detalle operativo general del mes (Excluye validación pendiente).</p>
                                    </div>
                                    <DebtTable data={dataPeriodo2} title="Detalle - Setiembre" />
                                </div>
                            )}

                            {/* NUEVA VISTA PARA PENDIENTE SETIEMBRE */}
                            {activeTab === 'pendienteSept' && (
                                <div className="animate-fade-in">
                                    <div className="p-4 bg-slate-800 border-l-4 border-yellow-500 mb-4 rounded-r flex items-start gap-3">
                                        <FileSearch className="text-yellow-500 mt-1" size={24} />
                                        <div>
                                            <h4 className="font-bold text-yellow-500">En Proceso de Validación (Ana Castillo)</h4>
                                            <p className="text-sm text-slate-300">
                                                Este monto de <strong>{formatMoney(4338.59)}</strong> ha sido separado del reporte principal de Setiembre 
                                                ya que se encuentra bajo revisión por falta de detalle inicial.
                                            </p>
                                        </div>
                                    </div>
                                    <DebtTable data={dataPendienteSept} title="Detalle - Pendiente Setiembre (Ana)" />
                                </div>
                            )}

                            {activeTab === 'octubre' && (
                                <div className="animate-fade-in">
                                    <div className="p-4 bg-slate-800 border-l-4 border-red-500 mb-4 rounded-r">
                                        <h4 className="font-bold text-red-500">Corte Octubre</h4>
                                        <p className="text-sm text-slate-300">Costos operativos totales pendientes de cobertura.</p>
                                    </div>
                                    <DebtTable data={dataOctubre} title="Detalle - Octubre" />
                                </div>
                            )}

                            {activeTab === 'noviembre' && (
                                <div className="animate-fade-in">
                                    <div className="p-4 bg-slate-800 border-l-4 border-red-500 mb-4 rounded-r">
                                        <h4 className="font-bold text-red-500">Corte Noviembre (al 25)</h4>
                                        <p className="text-sm text-slate-300">Acumulado reciente pendiente de gestión.</p>
                                    </div>
                                    <DebtTable data={dataNoviembre} title="Detalle - Noviembre" />
                                </div>
                            )}

                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
